# Nginx Configuration for Quotelytics (WHC Cloud VPS - Montreal/Halifax)
# Server: Ubuntu 24.04 LTS • Domain: quotelytics.ca / www.quotelytics.ca

server {
    listen 80;
    listen [::]:80;
    server_name quotelytics.ca www.quotelytics.ca;

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (Certbot will manage SSL certs)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quotelytics.ca www.quotelytics.ca;

    # SSL Certificates managed by Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/quotelytics.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotelytics.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Canadian Data Sovereignty & Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Data-Residency "CA_CENTRAL_WHC" always;

    # Maximum Rate Sheet Spreadsheet Upload Size (25 MB)
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Proxy to Gunicorn / Uvicorn ASGI Application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keep alive & long computation timeout for heavy tariff parsing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Static Assets Cache
    location /static/ {
        alias /srv/quotelytics/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Health Check Endpoint Bypass (Fast ping response)
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }
}
