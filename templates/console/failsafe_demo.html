<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateSift Header Failsafe & Mapping Modal Playground</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h1 class="text-xl font-bold text-slate-900">RateSift Header Failsafe UI Playground</h1>
      <p class="text-xs text-slate-500 mt-1">
        Interactive verification of the Phase 4 mapping modal conforming to the failsafe contract.
      </p>

      <div class="mt-6 flex flex-wrap gap-3">
        <button onclick="launchWeightAmbiguousDemo()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition cursor-pointer">
          Trigger Modal: Ambiguous Weight Sheet
        </button>
        <button onclick="launchSkidDemo()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition cursor-pointer">
          Trigger Modal: Skid / Pallet Sheet
        </button>
        <button onclick="launchConflictDemo()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition cursor-pointer">
          Trigger Modal: Header Conflict Detected
        </button>
      </div>

      <div id="demo-result" class="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200 font-mono text-xs hidden">
        <div class="font-bold text-slate-700 mb-1">Process Callback Output:</div>
        <pre id="demo-result-content" class="text-emerald-700"></pre>
      </div>
    </div>
  </div>

  <!-- Include the reusable failsafe mapping modal -->
  {% include "console/components/mapping_modal.html" %}

  <script>
    // Demo scenarios for visual inspection and manual testing
    function launchWeightAmbiguousDemo() {
      const job = {
        job_id: "demo-job-weight-123",
        status: "needs_mapping",
        header_row: 1,
        column_count: 7,
        mode: "weight",
        weight_unit: null, // missing unit triggers user prompt
        issues: [
          "Origin and Destination columns mapped with moderate confidence (needs confirmation).",
          "Weight break columns detected, but weight unit (lb vs kg) could not be identified."
        ],
        conflicts: [],
        suggestions: { origin: 0, destination: 1 },
        preview: [
          ["Carrier XYZ Regional Tariff 2026", "", "", "", "", "", ""],
          ["Origin City", "Dest Province", "Min Charge", "-45", "100+", "500+", "1000+"],
          ["Toronto", "ON", "45.00", "1.25", "0.95", "0.80", "0.65"],
          ["Montreal", "QC", "50.00", "1.40", "1.05", "0.90", "0.75"],
          ["Calgary", "AB", "95.00", "2.80", "2.10", "1.85", "1.60"]
        ]
      };
      FailsafeModal.open(job);
    }

    function launchSkidDemo() {
      const job = {
        job_id: "demo-job-skid-456",
        status: "needs_mapping",
        header_row: 0,
        column_count: 6,
        mode: "skid",
        issues: [
          "Sheet exhibits skid/pallet rate brackets.",
          "Please verify rate columns before proceeding."
        ],
        conflicts: [],
        suggestions: { origin: 0, destination: 1 },
        preview: [
          ["Origin", "Destination", "1 PL", "2 PL", "3 PL", "4 PL"],
          ["Mississauga", "Vaughan", "120.00", "210.00", "290.00", "360.00"],
          ["Brampton", "Oakville", "135.00", "230.00", "310.00", "380.00"]
        ]
      };
      FailsafeModal.open(job);
    }

    function launchConflictDemo() {
      const job = {
        job_id: "demo-job-conflict-789",
        status: "needs_mapping",
        header_row: 0,
        column_count: 5,
        mode: "weight",
        weight_unit: "lb",
        issues: [
          "Origin and Destination could not be cleanly identified.",
          "Two columns compete for destination."
        ],
        conflicts: [
          { field: "destination", columns: [1, 2], reason: "Both 'Dest City' and 'Dest Zip' matched destination pattern" }
        ],
        suggestions: { origin: 0 },
        preview: [
          ["Origin State", "Dest City", "Dest Zip", "-45", "100+"],
          ["OH", "Chicago", "60601", "1.10", "0.85"],
          ["IL", "Detroit", "48201", "1.30", "0.98"]
        ]
      };
      FailsafeModal.open(job);
    }

    window.onFailsafeMappingComplete = function(result) {
      const box = document.getElementById('demo-result');
      const content = document.getElementById('demo-result-content');
      box.classList.remove('hidden');
      content.innerText = JSON.stringify(result, null, 2);
    };
  </script>
</body>
</html>
