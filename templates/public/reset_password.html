<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Quotelytics | Set New Password</title>
  <meta name="description" content="Set a new password for your Quotelytics freight rating account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://quotelytics.ca/reset-password">
  <meta property="og:locale" content="en_CA">

  <!-- Self-Hosted Tailwind CSS Framework -->
  <script src="/static/js/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #0f172a;
      --card: #ffffff;
      --card-foreground: #0f172a;
      --border: #e2e8f0;
      --muted: #f8fafc;
      --muted-foreground: #64748b;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased m-0 p-0 min-h-screen flex flex-col justify-between w-full">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:px-3 focus:py-2 focus:bg-red-600 focus:text-white focus:rounded-lg focus:shadow-md text-xs font-semibold">
    Skip to main content
  </a>

  <div class="w-full min-h-screen flex flex-col justify-between m-0 p-0 bg-[var(--background)] text-[var(--foreground)]">
    <header role="banner" class="w-full px-4 sm:px-6 lg:px-8 py-3.5 border-b border-[var(--border)] flex items-center justify-between bg-[var(--card)] relative z-20 m-0">
      <a href="/" class="flex items-center gap-2.5 z-10 hover:opacity-90 transition-opacity" title="Quotelytics Home">
        <img src="/static/images/quotelytics-logo.png" onerror="this.onerror=null; this.src='/static/images/quotelytics-logo.png';" alt="Quotelytics" class="h-8 md:h-9 w-auto object-contain" />
      </a>
      <div class="flex items-center gap-3 z-10">
        <a href="/login" class="text-xs font-semibold text-slate-700 hover:text-red-600 transition-colors px-2 py-1">Log in</a>
      </div>
    </header>

    <main id="main-content" role="main" class="flex-1 flex items-center justify-center p-6 md:p-10">
      <div class="w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-red-50 border border-red-100 text-red-600 flex items-center justify-center mx-auto text-xl shadow-2xs font-bold" aria-hidden="true">Q</div>
          <h1 class="text-2xl font-extrabold tracking-tight text-[var(--foreground)]">Choose a new password</h1>
          <p class="text-xs text-[var(--muted-foreground)] max-w-sm mx-auto leading-relaxed">
            Enter a strong password of at least 10 characters. All existing sessions will be signed out for security.
          </p>
        </div>

        <div class="border border-[var(--border)] rounded-2xl bg-[var(--card)] p-6 shadow-sm space-y-4">
          <form id="reset-form" onsubmit="handleResetPassword(event)" class="space-y-4" novalidate>
            <input type="hidden" id="reset-token" name="token" value="">

            <div class="space-y-1.5">
              <label for="new-password" class="block text-xs font-bold text-[var(--foreground)]">New Password (min. 10 characters)</label>
              <input
                type="password"
                id="new-password"
                name="new_password"
                required
                autocomplete="new-password"
                placeholder="At least 10 characters"
                class="w-full px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs text-[var(--foreground)] focus:outline-hidden transition-all font-mono"
              >
            </div>

            <div class="space-y-1.5">
              <label for="confirm-password" class="block text-xs font-bold text-[var(--foreground)]">Confirm New Password</label>
              <input
                type="password"
                id="confirm-password"
                required
                autocomplete="new-password"
                placeholder="Re-enter your new password"
                class="w-full px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs text-[var(--foreground)] focus:outline-hidden transition-all font-mono"
              >
            </div>

            <button
              type="submit"
              id="reset-submit-btn"
              class="w-full py-2.5 px-4 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold text-xs transition-all shadow-xs flex items-center justify-center gap-2 cursor-pointer"
            >
              <span id="reset-submit-text">Update Password →</span>
            </button>

            <div id="reset-status" role="status" aria-live="polite" class="text-center text-xs"></div>
          </form>

          <div class="pt-3 border-t border-[var(--border)] text-center text-xs text-[var(--muted-foreground)]">
            <a href="/login" class="text-red-600 hover:underline font-bold">Return to Log in →</a>
          </div>
        </div>
      </div>
    </main>

    <footer role="contentinfo" class="mt-8 px-6 py-4 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-4 bg-[var(--card)]">
      <div class="flex flex-wrap items-center gap-6">
        <div class="flex items-center"><img src="/static/images/quotelytics-logo.png" alt="Quotelytics" class="h-6 md:h-7 w-auto object-contain" /></div>
        <nav aria-label="Footer Legal Navigation" class="flex items-center gap-4 text-xs font-medium text-[var(--muted-foreground)]">
          <a href="/privacy" class="hover:text-[var(--foreground)] transition-colors">Privacy</a>
        </nav>
      </div>
      <div class="text-xs text-[var(--muted-foreground)] font-medium">
        Quotelytics Quoting Engine • Canadian Residency (WHC)
      </div>
    </footer>
  </div>

  <script>
    (function initTokenFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const tok = params.get('token') || '';
      document.getElementById('reset-token').value = tok;
      if (!tok) {
        const statusEl = document.getElementById('reset-status');
        statusEl.className = 'text-center text-xs text-amber-700 font-semibold';
        statusEl.textContent = 'Missing password reset token. Please request a fresh link on the Forgot Password page.';
      }
    })();

    function handleResetPassword(e) {
      e.preventDefault();
      const token = document.getElementById('reset-token').value.trim();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const statusEl = document.getElementById('reset-status');
      const btn = document.getElementById('reset-submit-btn');
      const btnText = document.getElementById('reset-submit-text');

      if (!token) {
        statusEl.className = 'text-center text-xs text-red-600 font-semibold';
        statusEl.textContent = 'Missing reset token. Please request a new reset link.';
        return;
      }
      if (!newPassword || newPassword.length < 10) {
        statusEl.className = 'text-center text-xs text-red-600 font-semibold';
        statusEl.textContent = 'New password must be at least 10 characters long.';
        return;
      }
      if (newPassword !== confirmPassword) {
        statusEl.className = 'text-center text-xs text-red-600 font-semibold';
        statusEl.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btnText.textContent = 'Updating Password...';

      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: newPassword })
      })
      .then(async res => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Could not reset password.');
        statusEl.className = 'text-center text-xs text-emerald-700 font-semibold';
        statusEl.textContent = 'Password updated! Redirecting to Log in...';
        setTimeout(() => { window.location.href = '/login?reset=1'; }, 800);
      })
      .catch(err => {
        btn.disabled = false;
        btnText.textContent = 'Update Password →';
        statusEl.className = 'text-center text-xs text-red-600 font-semibold';
        statusEl.textContent = err.message || 'Invalid or expired reset link.';
      });
    }
  </script>
  <script src="/static/js/global-chrome.js"></script>
</body>
</html>
