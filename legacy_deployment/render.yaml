services:
  - type: web
    name: quotelytics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: QUOTELYTICS_ADMIN_EMAIL
        sync: false
      - key: QUOTELYTICS_ADMIN_PASSWORD
        sync: false
